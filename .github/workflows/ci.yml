# Draft CI for the future public repository. Not executed in GitHub yet.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ["55418:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          PGBENCH_TEST_URL: postgres://postgres:bench@localhost:55418/bench
